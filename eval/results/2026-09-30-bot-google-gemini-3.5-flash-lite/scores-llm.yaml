scored_by: LLM 채점 (openai/gpt-6.1-sol, 2026-09-30, tka.judge)
rule: tka.judge SYSTEM_PROMPT (사람 채점과 같은 기준). item_problem 문항은 뺀다
items:
- id: g01
  verdict: 정답
  reason: 도서 임베딩 모델 multilingual-e5-small과 벡터 차원 384를 모두 정확히 답했으며, 기준 정답 및 근거 원문과 일치한다.
- id: g02
  verdict: 정답
  reason: book_passage 원문조각 RAG를 쓰지 않으며, 현재 reason_long은 v_books.description만 근거로 생성한다고 정확히 답했다. 이전 결정과 폐기 이유에 대한 덧붙임은 채점 대상이 아니다.
- id: g03
  verdict: 정답
  reason: 현행 결정상 LangChain을 사용하며 ③ 대화 추천과 ⑤ 취향 기억 추출에 도입한다는 핵심을 정확히 답했다. ⑦ 쇼핑 에이전트의 LangGraph 사용은 질문이 직접 묻지 않은 부가 정보이므로 누락해도 정답이다.
- id: g04
  verdict: 정답
  reason: ① V1 검색은 BM25를 쓰지 않고 pg_trgm만 쓴다는 핵심을 정확히 답했다. 이전 결정에 대한 덧붙임은 채점 대상이 아니다.
- id: g05
  verdict: 정답
  reason: 홈 추천 피드(④)는 POST가 아닌 GET 방식으로 호출한다고 정확히 답했다. 질문이 묻는 HTTP 메서드를 맞혔으므로 정답이다.
- id: g06
  verdict: 부분
  failure: 근거 찾고 틀림
  reason: 필터와 벡터 정렬을 함께 처리하기 위한 목적과 AI 버그로부터 주문·재고를 보호하는 이유는 맞게 설명했다. 다만 BE MySQL 장애 시에도 AI가 복제본으로 계속 응답할 수 있다는 장애 격리 이유가 빠졌다.
- id: g07
  verdict: 정답
  reason: 도구가 7개로 고정되어 있고 연결 상대가 BE 팀 하나뿐이라 MCP 도입의 이점이 없다는 핵심 이유를 정확히 말했다. MCP 양식으로 도구 목록을 작성한 대안은 질문이 직접 묻는 내용이 아니므로 빠져도 정답이다.
- id: g08
  verdict: 정답
  reason: 답에서 제시한 다섯 컬럼(book_id, sales, rating_avg, rating_count, as_of)이 기준 정답 및 근거 원문과 모두 일치한다.
- id: g09
  verdict: 정답
  reason: AI Postgres 장애 시 검색·챗봇·피드가 전면 500이 되고 구매 경로는 정상이라는 핵심을 모두 정확히 답했다.
- id: g10
  verdict: 정답
  reason: 질문이 직접 묻는 PR의 CI 수행 항목인 Lint, Test, Build를 모두 정확히 말했다. main 병합 후 Docker 이미지 자동 생성은 질문의 핵심이 아니므로 생략해도 정답이다.
- id: g11
  verdict: 정답
  reason: 질문이 묻는 수정 위치인 레포의 docs/ 폴더에서만 수정한다는 핵심을 정확히 답했다. 위키 반영 담당자는 질문이 직접 묻지 않은 부가 설명이므로 생략해도 정답이다.
- id: g12
  verdict: 정답
  reason: 기준 정답과 같이 근거 문서에서 전역 상태 관리 라이브러리를 확인할 수 없다고 답했으며, 라이브러리 값을 지어내지 않았다.
- id: g14
  verdict: 정답
  reason: 배송비가 0원이며 탈퇴 신청 후 7일 이내에 다시 로그인하면 기존 계정을 복구할 수 있다고 두 핵심을 모두 정확히 답했다.
- id: g15
  verdict: 부분
  failure: 근거 찾고 틀림
  reason: AI가 복제 시 Asia/Seoul로 해석한다는 점은 맞았다. 그러나 BE 시각 컬럼의 정확한 타입인 DATETIME(6)을 명시하지 않았고, 첫 문장의 timestamptz는 AI 측 타입이므로 BE 타입에 대한 답이 불명확하다.
- id: g16
  verdict: 정답
  reason: 결정 로그의 {message, data}와 FS-2 API 명세의 {result, data, error}를 모두 제시하고 각각의 근거를 인용했다.
- id: g17
  verdict: 정답
  reason: 질문이 묻는 API 경로 GET /api/v1/items와 cursor 페이지 방식을 모두 정확히 답했다. 권한 공개는 질문에서 묻지 않은 부가 정보이므로 누락해도 정답이다.
- id: g18
  verdict: 정답
  reason: 질문이 묻는 배포 방식인 Application 컨테이너만 교체하는 Recreate 전략과 계획된 API 중단 목표인 최대 5분 이내를 모두 정확히 답했다. 배포 시간대와 데이터 유실 금지 조건은 질문의 핵심이 아닌 부가 사항이므로 생략해도 정답이다.
- id: g19
  verdict: 정답
  reason: 취향 벡터가 없어도 구매·리뷰 이력이 있으면 챗봇과 피드가 개인화된다는 핵심을 정확히 답했다. 이력과 온보딩이 모두 없을 때의 cold_start 조건은 질문이 직접 묻지 않은 부가 설명이므로 생략해도 정답이다.
- id: g20
  verdict: 정답
  reason: 문서에 PG사가 명시되어 있지 않으므로, 답을 찾지 못했다고 하고 PG사 이름을 지어내지 않은 답변은 기준 정답과 일치한다.
- id: g21
  verdict: 오답
  failure: 근거 찾고 틀림
  reason: V2 AI 작업 큐는 SQS Standard + DLQ로 확정됐는데, 답은 docs/ 범위라는 제한을 밝히지 않고 도입 여부를 ‘아니오’로 단정했다. 취향 추출의 메시지 큐 전환이 열려 있다는 설명만으로는 핵심 결정에 답한 것이 아니다.
