    모름 — 근거 문서에서 질문에 대한 답을 찾지 못했다.
    관련해 문서에 있는 것:
    AI Postgres가 죽으면 검색·chat·feed 전면 500이 되어 API 기능 전체가 중단된다. [1]
    AI 데이터는 이 한 DB에 몰려 있어 여기 죽으면 AI 기능 전체가 죽는 것이 트레이드오프로 명시되어 있다. [1]
    반대로 BE MySQL이 죽어도 AI는 낡은 복제본으로 계속 200 응답한다. [2]

