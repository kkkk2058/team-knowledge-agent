    PR에서 CI는 Frontend의 경우 Lint, Test, React Build를 수행하며, Backend와 AI Server는 Build 가능 여부만 확인합니다. [1][2]
    Frontend는 Docker Image를 사용하지 않아 PR에서는 Build 가능 여부만 확인하고 실제 Build와 S3 배포는 배포 단계에서 수행합니다. [1]
    PR에서 검증을 마쳤기 때문에 `main`에서는 Test를 반복하지 않으며, Backend와 AI Server의 Docker Image는 `main` Merge 후에만 생성합니다. [1]

