- id: g16
  answer: |-
    API 공통 응답 형식은 FS API와 AI API에서 다릅니다. [1]
    FS API는 result, data, error 세 필드를 가진 ApiResponse로 정의합니다. [2]
    AI API는 message와 data 필드를 가진 형식으로, 챗봇 스트리밍(SSE)은 V2에서만 사용하고 V1은 JSON envelope 한 번으로 응답합니다. [1][3][4]
    AI API의 에러 응답은 상태 코드(400, 401, 413, 429, 500)와 message 필드(invalid_request, unauthorized, payload_too_large, rate_limited, internal_server_error)로 표기합니다. [5]

