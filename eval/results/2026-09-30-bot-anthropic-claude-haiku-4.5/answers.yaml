- id: g06
  answer: |-
    BE와 AI가 DB를 따로 쓰는 이유는 추천·검색 질의에서 필터와 벡터 정렬을 한 번에 처리하기 위해서입니다. [1]
    BE는 MySQL을 쓰고, AI는 자신의 PostgreSQL을 소유하며 커머스 데이터는 BE MySQL에서 AI Postgres로 단방향 복제로만 들어옵니다. [1][2]
    AI 서버에는 BE MySQL로 가는 연결 자체가 없어서, 추천·검색 코드에 버그가 있어도 주문 데이터나 재고를 망가뜨릴 수 없습니다. [2]
    테이블마다 writer가 하나이므로 양쪽이 같은 행을 쓰면 충돌 해결 규칙이 필요해지고, 그 규칙이 틀리면 주문·재고가 조용히 덮일 수 있기 때문입니다. [3]

    근거:
    [1] KTB4-13th-wiki/docs/ai/3-architecture-modularization/design.md:196-206@4f6a6a6 — AI-3 아키텍처 모듈화 설계 > 2. 모듈 책임 (제출 항목 2) > 결정 4 — 벡터는 별도 DB 안 만들고, AI 전용 PostgreSQL 하나로
