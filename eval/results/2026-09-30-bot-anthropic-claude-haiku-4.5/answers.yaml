- id: g07
  answer: |-
    MCP 전송 규격을 도입하지 않은 이유는 표준화할 대상이 BE 도구 7개로 고정되어 있고, 상대가 BE 팀 하나뿐이라 전송 프로토콜의 값이 회수되지 않기 때문입니다. [1][2]
    MCP의 장점은 도구가 계속 늘고, 남이 만든 도구를 갖다 쓰고, 여러 AI가 도구를 나눠 쓸 때 나오는데, 우리는 도구 7개 고정이고 상대는 우리 BE 팀 하나라 장점이 없습니다. [1]
    MCP 전송으로 전환하는 재평가 트리거는 에이전트가 자체 BE 밖의 도구를 써야 하거나, BE tool의 소비자가 AI 서버 외에 생기거나, tool 세트가 동적·대규모가 되거나, 서드파티가 우리 추천을 도구로 호출하는 B2B 요구가 생길 때입니다. [3]
    대신 MCP의 스키마 관례(선언적 도구 디스크립터 + 능력 어노테이션)만 차용하고 있으며, 나중에 통로 코드 1개만 갈아 끼우면 진짜 MCP로 전환 가능합니다. [4][2]

    근거:
