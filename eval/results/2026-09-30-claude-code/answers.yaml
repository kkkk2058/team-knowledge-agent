  answer: |-
    레포 문서 기준으로 **LangChain을 쓰기로 결정은 했지만, 실제 코드는 아직 전환 전(직접 SDK 호출)** 상태입니다.

    - 결정 로그: 2026-09-21에 ③(대화 추천)·⑤(취향 기억 추출)는 **LangChain**, ⑦(쇼핑 에이전트)은 **LangGraph** 도입으로 V1의 "미도입" 결정을 번복함
      → `docs/dec/000-decision-log.md:23`

    - 설계 문서에도 같은 결정이 반영됨: "③ 대화 추천·⑤ 취향 기억 추출은 LangChain, ⑦ 쇼핑 에이전트는 LangGraph로 구현한다"
      → `docs/ai/4-multistep-pipeline/design.md:13`

    - 다만 예외 규칙 있음: 벡터 임베딩이 필요할 때는 LangChain의 Embeddings 클래스를 쓰지 않고 모델 게이트웨이 `embed()`로만 호출 (저장된 벡터와 좌표계를 맞추기 위함)
      → `docs/ai/4-multistep-pipeline/design.md:15`

    - V1 시점엔 원래 "프레임워크 미채택(LangChain 도입 안 함)"이었다가 위 결정으로 뒤집힌 것이 취소선으로 남아있음
      → `docs/ai/4-multistep-pipeline/design.md:406`, `docs/ai/4-multistep-pipeline/design.md:411-419`

    - 최종 통합 설계 문서에도 동일하게 반영: "③⑤ LangChain · ⑦ LangGraph 도입(2026-09-21 팀 논의로 변경)"
      → `docs/ai/8-final-integration/design.md:13`, `docs/ai/8-final-integration/design.md:155`

    - **단, 코드는 아직 전환되지 않음**: "코드는 아직 `openai` SDK 직접 호출(`app/gateway/llm.py`)이라 전환은 후속 작업이다"
      → `docs/inbox/ai/개발-로그.md:48`

    - 의존성 관점에서도 기록: "2026-09-21 이후 LangChain·LangGraph가 의존성에 더해져, 위 목록과 '단순' 서술은 도입 전 기준"
      → `docs/ai/6-tool-integration/design.md:369`

    **요약**: 설계·결정 문서상으로는 LangChain(③⑤)/LangGraph(⑦) 도입이 확정돼 있으나, 개발 로그 기준 코드 구현은 아직 `openai` SDK 직접 호출 단계이고 실제 전환은 후속 작업으로 남아 있습니다.
