    이 레포 기준으로 답하면: **② 챗봇 이미지 인식(표지 사진 검색)에서는 BM25를 쓰지만, ① 일반 검색(`POST /search`)에서는 V1에서 BM25를 쓰지 않는다.**

    - ① 검색은 `pg_trgm`(글자 조각)만 쓴다. 형태소 분석(Kiwi·Mecab-ko)+BM25를 261만 권 기준으로 비교했을 때 속도·품질 모두 pg_trgm이 나아서, V1은 형태소 분석을 쓰지 않기로 했다. 쓰지 않던 `tsvector` 색인도 지웠다.
      - `docs/dec/000-decision-log.md:20`
      - `docs/ai/4-multistep-pipeline/design.md:73`

    - 다만 ③ 챗봇의 "사진으로 책 찾기"(표지 이미지 인식) 흐름에서는 도서 DB 검색에 `BM25(title+author) + pg_trgm 오타 보정`을 쓴다고 별도로 명시되어 있다. 이건 ①의 키워드 검색 로직과는 다른 용도다.
      - `docs/ai/5-context-augmentation/design.md:163`
      - `docs/ai/6-tool-integration/design.md:195, 241`

    정리하면: 전체 검색(①)은 BM25 안 씀 → pg_trgm만. 표지 사진 인식용 도서 매칭은 BM25 씀.
