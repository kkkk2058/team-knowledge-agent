- id: g06
  answer: |-
    레포 문서에 따르면 BE와 AI가 DB를 분리해 쓰는 이유는 크게 세 가지로 정리돼 있습니다.

    **1. DB 엔진 자체가 다르다 — AI는 벡터 검색이 필요해서 PostgreSQL(pgvector)을 쓴다**
    > "BE는 MySQL, AI 서버는 pgvector를 얹은 PostgreSQL을 쓴다."
    — `docs/ai/9-data-erd/spec.md:14`

    `book_embeddings.embedding` 필드가 pgvector의 HNSW 인덱스 대상이라 `vector` 타입이 필수이고(`docs/ai/9-data-erd/spec.md:100`), 키워드 검색용 `pg_trgm` 인덱스도 같은 Postgres에 건다(`docs/ai/9-data-erd/spec.md:144`). 즉 AI가 필요로 하는 벡터/유사도 검색 기능이 BE의 MySQL에는 없기 때문에 별도 DB가 필요하다.

    **2. 테이블마다 writer(쓰기 주체)를 하나로 유지하기 위해 — 복제를 한 방향으로만 둔다**
    > "복제는 BE MySQL → AI Postgres 단방향뿐이고 역방향 복제는 없다." / "테이블마다 writer가 하나다. 양쪽이 같은 행을 쓰면 충돌 해결 규칙이 필요해지고, 그 규칙이 틀리면 주문·재고가 조용히 덮인다." / "AI가 만든 값이 BE 검증을 우회하지 않는다."
    — `docs/ai/9-data-erd/spec.md:14`, `255-258`

    즉 커머스 원본(회원·주문·재고 등)은 BE가 소유하고, AI가 만드는 값(취향 프로필, 임베딩 등)은 AI가 소유하도록 나눠서 쓰기 충돌과 검증 우회를 막는다.

    **3. 장애/영향 범위를 분리하기 위해**
    > "권한 부여 범위와 장애 전파 범위 확인용이다. 조회 대상은 전부 AI PostgreSQL 안에 있다 — BE 장애가 조회 실패로 오지 않고 복제가 멈추면 값이 갱신되지 않을 뿐이다."
    — `docs/ai/9-data-erd/spec.md:279`

    즉 AI 서버가 BE DB를 직접 조회하지 않고 자기 DB 안의 복제본만 보게 해서, BE 장애가 AI 조회 실패로 바로 전파되지 않게 한다(복제가 멈추면 데이터가 오래될 뿐).

    참고로 이 구조에서 `v_` 접두사가 붙은 테이블들(`v_books`, `v_products` 등)은 AI DB 안의 "BE 원본 사본"이며 AI는 이를 읽기만 하고 쓰지 않는다(`docs/ai/9-data-erd/spec.md:19, 23`).
