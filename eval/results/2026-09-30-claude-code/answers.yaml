- id: g18
  answer: |-
    V1 배포 방식과 API 중단 시간에 대한 근거를 찾았습니다.

    ## 배포 방식

    - **인프라**: App EC2(Nginx·Backend·MySQL)와 AI EC2(AI Server·PostgreSQL/pgvector)에서 각각 별도의 Docker Compose를 실행하는 구조 (`docs/cld/1-initial-deploy/compose.md:16`, `docs/cld/3-cd-pipeline/overview.md:31-34`)
    - **CI/CD**: GitHub Actions + AWS Systems Manager(SSM Run Command)로 배포를 실행하며, 운영 반영은 GitHub `production` Environment의 승인을 거치는 **Continuous Delivery** 방식 (SSH 대신 SSM 사용) (`docs/cld/3-cd-pipeline/overview.md:34, 44, 400`)
    - **배포 전략**: 추가 서버 없이 애플리케이션 컨테이너만 새 이미지로 교체하는 **Recreate 전략**을 사용하며, Blue-Green/Rolling/Canary는 자원·비용 문제로 제외 (`docs/cld/3-cd-pipeline/overview.md:64, 264-290`)
    - **배포 순서**: AI Server 배포·검증 → Backend 배포·검증 → Frontend 전환(S3 `releases/<sha>/` 경로 전환) → 최종 Smoke Test (`docs/cld/3-cd-pipeline/overview.md:138-147`)
    - MySQL·PostgreSQL(pgvector) 컨테이너와 Volume은 일반 배포·Rollback 과정에서 재생성하지 않음 (`docs/cld/3-cd-pipeline/overview.md:151, 344`)
    - 배포는 이미지 태그로 Git Commit SHA를 사용하며, 실패 시 직전 버전(`previous-release.env`)으로 자동/수동 Rollback 가능 (`docs/cld/1-initial-deploy/compose.md:270-277`, `docs/cld/3-cd-pipeline/overview.md:159-177, 326-350`)

    ## 배포 중 API 중단 시간

    - 배포는 점심·저녁 등 사용자 집중 시간대를 피해 진행하며, **계획된 API 중단은 최대 5분 이내를 목표**로 함 (단, 주문·거래 데이터 유실은 허용하지 않음) (`docs/cld/3-cd-pipeline/overview.md:66`)
    - 현재 CD 구조의 한계로도 "**Recreate 배포 중 최대 5분의 서비스 중단이 발생할 수 있음**"이라고 명시 (`docs/cld/3-cd-pipeline/overview.md:424`)
    - V1은 무중단 배포(Blue-Green/Rolling)를 도입하지 않고 짧은 중단을 허용하는 것을 전제로 설계됨 (`docs/cld/1-initial-deploy/overview.md:18`, `docs/cld/3-cd-pipeline/overview.md:22, 281, 290`)
