  answer: |-
    ## 답변

    **BE 테이블의 시각 컬럼 타입: `DATETIME(6)`**
    - `TIMESTAMP`의 2038년 상한을 피하려고 `DATETIME(6)`을 선택했다 — `docs/fs/1-table-spec/spec.md:33-34`
    - 실제 테이블 정의에서도 `created_at`/`updated_at`/`deleted_at` 등 모든 시각 컬럼이 `DATETIME(6)`으로 명시돼 있다 (예: `docs/fs/1-table-spec/spec.md:63-65`)

    **AI는 복제 시 어느 시간대로 해석하는가: 한국 시간(Asia/Seoul)**
    - AI 쪽 결론: "BE MySQL `DATETIME`은 시간대가 없고 BE는 한국 시간(Asia/Seoul)으로 저장하므로, 복제 시 Asia/Seoul로 해석해 적재한다" — `docs/ai/9-data-erd/spec.md:87`
    - 근거 표에도 동일하게 정리돼 있다: "BE 원본은 `DATETIME(6)`이고 한국 시간으로 저장된다(배포 설정 `TZ: Asia/Seoul`, 클라우드 compose 문서) → 결정 완료: 복제는 Asia/Seoul로 해석해 적재한다" — `docs/ai/9-data-erd/spec.md:311`
    - 단, 이 항목의 "BE 협의" 칸은 "불필요. 실제 복제 설정 확인만 남음(AI #235)"이라고 돼 있어, 실제 복제 파이프라인 설정으로 확정 검증되는 절차는 아직 남아 있다 — `docs/ai/9-data-erd/spec.md:311`

    적재 후 AI 쪽 저장 타입은 `timestamptz`이며, 복제된 시각을 UTC 기준으로 비교한다: "모든 시각 컬럼은 `timestamptz`다" — `docs/ai/9-data-erd/spec.md:87`
