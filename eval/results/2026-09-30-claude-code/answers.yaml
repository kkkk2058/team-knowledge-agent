  answer: |-
    `v_book_popularity` (인기 점수 복제 테이블) 컬럼은 다음과 같습니다.

    | 필드명 | 타입 | Null 허용 | 설명 |
    | --- | --- | --- | --- |
    | book_id | int PK | N | 도서 ID |
    | sales | int | N | 최근 판매 수 (판매 없으면 0) |
    | rating_avg | float | Y | 평균 별점 (지금은 읽지 않음) |
    | rating_count | int | N | 리뷰 수 (지금은 읽지 않음) |
    | as_of | timestamptz | N | 집계 기준 시각 (BE가 채운 값 그대로 복제) |

    현재 인기 점수는 `sales`(판매 수) 단일 기준이며, `rating_avg`/`rating_count`는 컬럼은 있지만 아직 읽지 않는다고 명시되어 있습니다.

