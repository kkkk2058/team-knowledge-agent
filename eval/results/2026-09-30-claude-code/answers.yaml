- id: g09
  answer: |-
    **AI Postgres가 죽으면 관련 API는 전면 500을 반환한다. 구매 경로는 영향 없음.**

    - AI 서버는 BE(Spring+MySQL)와 완전히 분리된 자기 소유 PostgreSQL(+pgvector)을 쓰고, BE→AI 단방향 복제만 있어서 AI DB 장애가 BE 쪽으로 전파되지는 않지만, AI Postgres 자체가 응답하지 않으면 그 위에 얹힌 검색·추천·챗봇·피드 기능이 전부 500을 낸다.
      - `docs/ai/3-architecture-modularization/design.md:218` — "BE MySQL이 죽어도 AI는 낡은 복제본으로 계속 200 응답한다(복제만 멈춤, AI 응답은 500이 아님) — 반대로 AI Postgres가 죽으면 검색·추천 전체가 500이다."
      - `docs/ai/3-architecture-modularization/design.md:280` — "AI Postgres 장애 | 검색·chat·feed 전면 500. 구매 경로는 정상"
      - `docs/ai/9-data-erd/spec.md:59` — "AI Postgres가 응답하지 않는 것 — 전면 500이다. 위 0점 규약을 적용하지 않는다."
      - `docs/ai/1-model-api/spec.md:1225` — "AI Postgres 장애는 전면 500이고, BE MySQL 장애는 500이 아니라 복제만 멈춘다"
      - `docs/ai/4-multistep-pipeline/design.md:106` — "AI Postgres 자체가 응답 불능이면 전면 500."
      - `docs/ai/7-infra-monitoring/design.md:193` — "`postgres` 중단 | ①③④⑥ 전면 500 | 검색·추천 불가. **구매 경로는 정상** | 5xx 비율, DB 연결 실패 | 컨테이너 재기동. 데이터는 EBS에 남는다"
      - `docs/ai/6-tool-integration/design.md:199` — "**AI PG 전면 장애만 ①③④ 500**, 복제 지연·행 부재는 낡은 값으로 200"

