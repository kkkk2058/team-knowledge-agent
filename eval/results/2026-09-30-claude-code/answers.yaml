  answer: |-
    Repo의 `docs/cld/2-ci-pipeline/overview.md` 기준으로, PR(Pull Request)에서 CI는 다음을 수행합니다.

    **언제 실행되나**
    - `main` 대상 PR이 생성·재오픈되거나 새 커밋이 추가되면 CI 실행 (`docs/cld/2-ci-pipeline/overview.md:117`)
    - 단, Markdown과 `docs/**`만 바뀐 경우엔 실행하지 않음 (`docs/cld/2-ci-pipeline/overview.md:153`)
    - 같은 PR에 새 커밋이 추가되면 기존 실행은 취소하고 최신 커밋만 검증 (`docs/cld/2-ci-pipeline/overview.md:147`)

    **Repository별 실행 작업**
    - Frontend: Lint → Test → React Build
    - Backend: Lint → Test → Application Build
    - AI Server: Lint → Test
    (`docs/cld/2-ci-pipeline/overview.md:119-123`)

    **각 단계가 확인하는 것**
    - Lint: 문법 오류, 미사용 코드, 잘못된 import, 코드 규칙 위반 — 실패 시 Test·Build 미실행 (`docs/cld/2-ci-pipeline/overview.md:163`)
    - Test: 변경 코드가 의도대로 동작하고 기존 기능에 영향 없는지 확인 — 실패 시 Merge 차단 (`docs/cld/2-ci-pipeline/overview.md:167`)
    - Build: 실행/배포 가능한 결과물 생성 확인 — 실패 시 Merge 차단 (`docs/cld/2-ci-pipeline/overview.md:169-177`)

    **PR 단계의 목적/제약**
    - 코드 작성 규칙 위반, Test·Build 실패를 확인해 문제 있는 코드가 `main`에 반영되는 것을 막음 (`docs/cld/2-ci-pipeline/overview.md:64-69`)
    - PR 단계에는 AWS 권한을 주지 않고 `GITHUB_TOKEN`은 `contents: read`만 허용 — Docker Image 생성/ECR Push는 PR에서 하지 않고 `main` Merge 후에만 수행 (`docs/cld/2-ci-pipeline/overview.md:84`, `129-141`)
    - Discord notification: 실패 시 PR 작성자에게 알림 전송 (YAML 예시, `docs/cld/2-ci-pipeline/overview.md:217-219`, `258-260`, `315-317`)

    정리하면, PR CI는 **Lint → Test → (Frontend/Backend만) Build**를 GitHub-hosted `ubuntu-latest` Runner에서 실행해 코드 규칙·테스트·빌드 가능 여부만 검증하고, Docker Image 빌드/ECR Push는 하지 않습니다.
