- id: g07
  answer: |-
    根거를 찾았습니다. `docs/ai/6-tool-integration/design.md`가 핵심 근거입니다.

    ## 답변

    MCP **전송(transport)/서버 프로세스**는 도입하지 않았고, MCP의 **스키마 관례(디스크립터 형식)**만 차용했습니다.

    **이유 — MCP가 값을 내는 조건에 지금 서비스가 해당하지 않기 때문**

    | MCP의 강점 | 이 서비스의 상황 |
    |---|---|
    | 도구를 동적으로 발견·협상 | tool이 7종으로 고정, `allow_tools` 화이트리스트도 이미 있음 → 이득 없음 |
    | 서드파티 도구 서버를 표준 방식으로 연결 | 상대는 자체 BE 팀 하나뿐, 서드파티 직결 없음 |
    | 한 도구 서버를 여러 AI 클라이언트가 공유 | BE tool 소비자가 AI 서버 하나뿐(단일 소비자) |
    | 모델↔도구 전송·인증 표준화 | AI↔BE가 같은 내부망 + 서비스 토큰으로 이미 단순하게 풀림 |
    | LLM SDK의 네이티브 tool-calling | MCP 없이 JSON Schema 디스크립터만 있으면 충분 |

    (docs/ai/6-tool-integration/design.md:51-64)

    대신 채택한 방식은 "MCP 호환 디스크립터 + 내부 REST 전송"입니다. BE tool 기능을 MCP와 같은 양식(이름/설명/받는 값 형식/성격)으로만 적어두고, 실제 통신은 평범한 내부 REST로 처리합니다. 나중에 진짜 MCP로 바꿔야 할 일이 생겨도 호출부 코드는 그대로 두고 전송 어댑터 1개만 교체하면 되도록 설계했습니다. (docs/ai/6-tool-integration/design.md:16-27, 65-70, 112)

    **재평가(전환) 트리거** — 다음 중 하나라도 충족되면 MCP 전송으로 전환:
    1. 에이전트가 자체 BE 밖의 도구를 써야 함 (배송사 추적, 외부 예약/티켓, 결제대행 등)
    2. BE tool의 소비자가 AI 서버 외에 생김 (다른 내부 서비스, 파트너)
    3. tool 세트가 동적·대규모가 되어 수기 디스크립터 관리가 불가능해짐
    4. 서드파티가 우리 추천을 도구로 호출하는 B2B 요구 (자사가 MCP 서버가 되는 경우)

    (docs/ai/6-tool-integration/design.md:101-110)

    **근거 파일·줄**
    - docs/ai/6-tool-integration/design.md:11 (요약)
    - docs/ai/6-tool-integration/design.md:16-27 (결론: MCP 미도입 + 대안)
    - docs/ai/6-tool-integration/design.md:49-64 (도입 여부 판단표)
    - docs/ai/6-tool-integration/design.md:101-112 (재평가 트리거·전환 비용)
    - docs/ai/8-final-integration/design.md:100 (요약 결정표)
