- id: g21
  answer: |-
    V2의 AI 비동기 작업에 메시지 큐를 쓰기로 확정된 결정은 없고, 구현 선택지로 열려 있다. [1][2]
    취향 추출(V2)을 야간 배치로 유지할지 메시지 큐로 뺄지는 현재 배치로 설계되어 있고 메시지 큐 전환은 구현 선택지로 열어 둔 상태다. [1][2]
    다만 비동기 처리 전반에 대해서는 현재 MQ를 도입하지 않고, 주문 완료 이벤트 하나에 알림·포인트·추천이 붙는 V2에서 RabbitMQ 도입을 검토할 예정이라고 밝히고 있다. [3]

