  answer: |-
    도서 임베딩 모델은 `multilingual-e5-small`이고 벡터 차원은 384차원이다. [1][2][3][4]
    임베딩 API 응답은 `dim` 384와 `model` `multilingual-e5-small`을 함께 돌려주고, 호출자는 이 차원이 자신이 쓰는 벡터 인덱스 차원과 같은지 확인한 뒤 저장해야 한다. [1][3]
    `book_embeddings` 테이블의 `embedding`은 `vector(384)` 타입이고, `model` 필드에 벡터 생성 모델 식별자(예: multilingual-e5-small)를 기록한다. [2]
    벡터 차원은 2026-09-16에 `multilingual-e5-small`(384차원)로 확정되었으며, `001_init.sql`이 `vector(384)`로 생성되고 명세 예시의 `dim`도 384다. [4]

