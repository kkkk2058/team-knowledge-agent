- id: g03
  answer: |-
    네, ③ 대화 추천과 ⑤ 취향 기억 추출은 LangChain으로 구현한다. [1][2][3]
    ⑦ 쇼핑 에이전트는 LangGraph로 구현한다. [1][3]
    이전에는 V1에 오케스트레이션 프레임워크(LangChain·LangGraph)를 도입하지 않는 결정이었으나 2026-09-21 팀 논의로 번복됐다. [1][3]
    미채택 판정과 재평가 트리거는 이력 참고용으로 남아 있고, 옛 서술이 아직 남은 곳도 있다. [1][3]
    ⑤에서 벡터가 필요할 때는 LangChain의 Embeddings 클래스를 쓰지 않고 모델 게이트웨이 `embed()`로만 부른다. [2][3]
    파이프라인 단계 구성과 역할 경계는 이 결정으로 바꾸지 않으며, 코드 전환은 후속 작업이다. [2][3]

