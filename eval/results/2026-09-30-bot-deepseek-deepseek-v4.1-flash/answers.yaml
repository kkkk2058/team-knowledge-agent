- id: g02
  answer: |-
    추천 이유(reason_long)를 만들 때 book_passage 원문조각 RAG는 쓰지 않는다. [1][2]
    2026-09-15 결정으로 book_passage 원문조각 RAG와 preset_vectors 얕은 RAG를 폐기했고, reason_long은 v_books.description만 근거로 카드 생성 한 호출에서 생성한다. [1][2][3]
    폐기 이유는 고정된 카드 3장의 이유 문구 생성에 벡터 인프라를 쓸 근거가 약하다는 과설계 판단이다. [2]
    이전에는 추천 이유를 book_passage 원문조각 RAG로 만든다는 결정이 있었고, 그 옛 서술이 설계 문서에 남아 있으나 폐기 이력 참고용이다. [1][2]
    AI 소유 테이블은 book_embeddings·taste_profile·멱등 기록 3종만 유지한다. [1]

