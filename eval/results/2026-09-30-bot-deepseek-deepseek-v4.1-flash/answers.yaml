  answer: |-
    MCP 전송/서버 프로세스는 도입하지 않고, MCP의 스키마 관례(선언적 도구 디스크립터 + 능력 어노테이션)만 차용하기로 했다. [1][2][3]
    표준으로 연결할 지점은 V2 쇼핑 에이전트가 BE 기능 7개를 부르는 한 곳뿐이고, 도구 7개가 고정이며 상대는 우리 BE 팀 하나라 MCP의 장점이 회수되지 않는다. [4][2]
    도구를 동적으로 발견·협상할 필요가 없고(allow_tools 화이트리스트가 이미 계약에 있음), 서드파티 도구 서버도 없으며, BE tool의 소비자도 AI 서버 하나뿐이다. [2]
    모델↔도구 전송·인증은 같은 내부망과 방향 전용 서비스 토큰, BE의 user_id 소유권 재확인으로 이미 단순하게 풀려 있고, LLM SDK의 네이티브 tool-calling 연동도 JSON Schema 디스크립터만 있으면 된다. [2]
    외부 AI 모델(문장 생성, 벡터 변환)은 이미 자체 창구인 모델 게이트웨이로 정리돼 있다. [4]
    나중에 전환이 필요해지면 ToolInvoker의 전송 어댑터 1개만 REST에서 MCP 클라이언트로 교체하면 되고, 디스크립터가 이미 MCP 형식이라 호출부·프롬프트·grounding 로직은 무변경이다. [5][3]
    재평가 트리거는 자체 BE 밖의 도구 사용, BE tool 소비자가 AI 서버 외에 생기는 경우, tool 세트가 동적·대규모가 되는 경우, 서드파티가 우리 추천을 도구로 호출하는 B2B 요구이며, 이 트리거는 LangGraph 도입 확정과 별개로 그대로 유효하다. [5]

