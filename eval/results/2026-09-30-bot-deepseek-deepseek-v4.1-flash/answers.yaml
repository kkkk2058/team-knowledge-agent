    변환이 끝난 문서는 레포 `docs/` 에서만 수정한다. [1][2][3]
    아직 변환되지 않은 문서는 원본 위키에서 수정한다. [2]
    원본 위키는 그대로 보존하고, 변환 전 원본은 backup에 보관한다. [1][3]
    다만 위키 반영 주체에 대해서는 문서가 서로 다르게 말한다. 결정 표에는 위키 반영이 09-17부터 CI 자동화로 대체되었다고 되어 있고, 문서 안내에는 위키에 문서 담당자가 반영한다고 되어 있다. [2][3]

