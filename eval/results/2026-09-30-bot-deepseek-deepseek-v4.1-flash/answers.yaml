  answer: |-
    현행 결정 기준 API 공통 응답 형식은 `{message, data}`이고 에러 표기를 맞추는 것이다. [1]
    V1 챗봇 추천은 SSE를 쓰지 않고 다른 API와 같이 `application/json` envelope 한 번으로 응답한다. [2][3]
    다만 FS-2 API 명세 본문은 모든 API 응답을 `{result, data, error}` 세 필드를 가진 `ApiResponse`로 정의해 결정과 다르다. [4]
    에러 식별자는 응답 envelope의 `message` 필드 하나로 통일하며 별도 `code` 필드는 없다. [3]
    공통 에러는 상태별 `message`로 표기한다. [5]

