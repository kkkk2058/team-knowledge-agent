  answer: |-
    V1에서는 키워드 검색에 BM25를 쓰지 않고 pg_trgm만 씁니다. [1][2]
    이전 결정은 형태소 분석 + BM25(tsvector)를 쓰는 것이었고, 옛 서술이 일부 설계 문서에 남아 있습니다. [1]
    다만 Visual RAG(표지 인식) 설계 문서에는 제목 BM25 + 저자/출판사 필터 + pg_trgm 오타 보정으로 검색한다는 서술이 있어, V1 키워드 검색 결정과 다른 값이 문서에 남아 있습니다. [3][4]

