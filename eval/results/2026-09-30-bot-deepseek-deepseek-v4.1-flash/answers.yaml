- id: g06
  answer: |-
    BE와 AI가 DB를 따로 쓰는 핵심 이유는 AI가 자기 전용 PostgreSQL(pgvector 기반)을 갖되 이를 BE와 공유하지 않고, 커머스 데이터는 BE MySQL에서 AI Postgres로 단방향 복제된 사본만 읽게 하려는 것입니다. [1][2]
    검색·추천 질의는 '가격 구간 + 재고 있음'이라는 필터와 '의미 비슷한 순'이라는 벡터 정렬을 한 번에 처리해야 하는데, BE가 MySQL인 상황에서 이 조건을 지킬 수 있는 유일한 방법이 필터용 컬럼들까지 AI Postgres로 복제해 벡터 옆에 두는 것이었습니다. [1]
    동시에 AI 서버에는 BE MySQL로 가는 연결 자체가 없도록 했는데, 그래야 추천·검색 코드에 버그가 생겨도 주문 데이터나 재고를 망가뜨릴 수 없기 때문입니다. [2]
    같은 맥락에서 테이블마다 writer를 하나로 두고 역방향 복제를 두지 않은 이유는, 양쪽이 같은 행을 쓰면 충돌 해결 규칙이 필요하고 그 규칙이 틀리면 주문·재고가 조용히 덮이는 것을 막기 위해서입니다. [3]
    DB 복제는 BE MySQL → AI PostgreSQL 한 방향뿐이며, AI가 만든 값이 BE에 저장되는 경로는 응답 본문과 tool 호출 둘뿐이고 어느 쪽도 복제가 아니라 BE가 검증한 뒤 자기 테이블에 쓰는 방식입니다. [3][4][5]
    부작용으로 복제 파이프라인(배치/CDC 등 수단 미정)과 신선도 예산(가격·재고 5분, 신간 1시간, 인기 24시간, 이력 5분)을 관리해야 하는 대가가 따릅니다. [1]

