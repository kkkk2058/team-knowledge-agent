    PR에서는 Lint, Test, Build를 수행한다. [1][2]
    Frontend는 PR에서 Build 가능 여부만 확인하고 실제 Build와 S3 배포는 배포 단계에서 수행한다. [3]
    PR에서는 Docker Image를 만들지 않고 Image는 `main`에서만 생성한다. [3][4]
    PR에서 검증을 마쳤기 때문에 `main`에서는 Test를 반복하지 않으며, Merge 시점의 상태를 다시 Test하지 않는 한계는 감수한다. [3]
    `docs-check.yml`과 `wiki-sync.yml`에서 `preserve_check`를 제거했고, PR 단계 CI가 `preserve_check` 오류 0을 강제하던 이전 결정은 이 결정으로 대체되었다. [5]

