- id: g18
  answer: |-
    V1은 추가 서버가 필요한 Blue-Green이나 Rolling 대신 Application 컨테이너만 교체하는 Recreate 전략으로 배포한다. [1]
    배포는 이용이 집중되는 점심·저녁 시간을 피해 진행하고, 계획된 API 중단은 최대 5분 이내를 목표로 한다. [1]
    V1은 단일 EC2 구성이며, 임베딩 컨테이너도 V1 배포 구성에 포함된다. [2]
    V1 개발 및 배포 기간은 약 3주로 설정되어 있다. [3]

