# - 각 항목이 진짜 문제인지, 의도된 차이인지는 해당 파트에 확인해야 한다 (status).
# - lines는 meta.refs 기준 줄 번호다.
# - 필드 이름과 구조는 예시다. 바꿔도 된다.

meta:
  checked_at: 2026-09-28
  refs:
    wiki_branch: "KTB4-13th-wiki @ ddfba15 (docs/fs-1-4-conversion)"
    be_main: "KTB4-13th-BE @ f32eb67 (main, 2026-09-28)"
    wiki_4f6a6a6: "KTB4-13th-wiki @ 4f6a6a6 (main, PR #184 병합)"
  kinds:
    문서-회의: 회의 기록(이슈)과 문서가 다름 (이슈 소스를 넣어야 탐지)
    문서-문서: 서로 다른 문서가 같은 주제에 다른 값을 말함
    범위 누락: 한 문서가 전제하는 것이 다른 문서에 없음
    문서-코드: 명세와 구현이 다름 (v2부터 탐지 가능)
    문서 내부: 한 문서 안에서 서로 다름
    메타: 문서 상태 표기가 서로 다름

