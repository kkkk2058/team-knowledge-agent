# 골든셋 — 봇과 베이스라인을 채점하는 기준
#
# - lines는 meta.source_commits의 커밋 기준 줄 번호다. v0 기준 커밋은 config/ktb13.yaml의 ref와 같아야 한다.
# - expected는 Claude가 기준 커밋 원문을 읽고 적은 값이다. 레포 주인이 확인하면 status를 "확정"으로 바꾼다.
#   봇 코드와 정답을 둘 다 Claude가 정하면 채점이 의미가 없다 (CLAUDE.md).
# - 함정 문항은 지금 값을 맞혔는지로 채점한다. note의 날짜·이력은 참고용이다 (plan.md D15).
# - 모름 문항은 "모름"이라고 답하고 지어내지 않으면 정답이다. absent_terms는 v0 문서에 정말 없는지
#   검사 코드가 확인하는 단어다.
# - version: 이 문항에 답하려면 필요한 단계. v0 평가는 version v0 문항 20개로 한다.
# - 이 20문항은 튜닝용이다. 만들면서 계속 본다. 최종 비교는 따로 모은 채점용 질문으로 한다(plan.md §4-1).
# - 확인용 시트(근거 줄 원문을 옆에 보여줌): uv run python -m tka.golden review

meta:
  checked_at: 2026-09-30
  source_commits:
