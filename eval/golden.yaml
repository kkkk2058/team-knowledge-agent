  - id: g06
    type: 결정 이유
    version: v0
    question: BE와 AI가 DB를 따로 쓰는 이유는?
    expected: >-
      AI 서버에는 BE MySQL 연결 자체가 없고 커머스 데이터는 단방향 복제로만 받는다.
      AI 코드에 버그가 있어도 주문·재고 데이터를 망가뜨릴 수 없고, BE MySQL이 죽어도 AI는 낡은 복제본으로 계속 응답한다.
      AI 전용 PostgreSQL + pgvector는 필터와 벡터 정렬을 한 SQL로 처리하려고 둔다
    evidence:
      - { repo: KTB4-13th-wiki, path: docs/ai/3-architecture-modularization/design.md, lines: "208-218" }
      - { repo: KTB4-13th-wiki, path: docs/ai/3-architecture-modularization/design.md, lines: "63" }
