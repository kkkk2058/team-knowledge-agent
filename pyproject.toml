[project]
name = "team-knowledge-agent"
version = "0.1.0"
description = "북적북적 팀 레포의 문서를 근거로 팀 질문에 답하는 지식 에이전트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kiwipiepy>=0.24.0",
    "markdown-it-py>=4.2.0",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
tka = "tka.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tka"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
