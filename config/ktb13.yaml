# 북적북적 팀(KTB4-13th) 설정. 팀 하나 = 설정 파일 하나 (plan.md D7).
# 경로는 레포 루트 기준이다.

team: ktb4-13th

# 결정 로그 날짜(예: 09-21)에는 연도가 없어서 이 값을 붙인다.
decision_log_year: 2026

paths:
  cache_dir: .cache/sources
  index_path: data/index.sqlite

sources:
  - name: wiki
    repo: 100-hours-a-week/KTB4-13th-wiki
    # 평가 기준 커밋. 브랜치 이름이 아니라 커밋으로 고정한다 (implementation.md ①).
    # 4f6a6a6 = PR #184(FS 문서) 병합 커밋, 2026-09-28.
    ref: 4f6a6a6
    # include 목록 밖은 모두 빠진다: backup/, docs/inbox/, 나머지 .agents/, .claude/ (context.md §3).
    include:
      - docs/README.md
      - docs/ai/
      - docs/cld/
      - docs/dec/
      - docs/fs/
      - .agents/skills/ktb4-docs/references/decisions.md
    exclude: []
    extensions: [.md]

# 결정 로그. 번복 관계는 로그에 칸이 없어서 보정 파일에 적는다 (implementation.md ③).
decisions:
  source: wiki
  log: docs/dec/000-decision-log.md
  corrections: config/ktb13-supersedes.yaml

# API 대조표 (implementation.md ⑨). 명세 ↔ 서버 코드 ↔ 호출 코드를 LLM 없이 맞춘다.
# 소스는 문서 색인(sources)과 따로 받는다. 같은 이름이면 캐시 폴더를 다른 커밋으로 덮어쓴다.
# 네 레포를 같은 날의 main으로 고정해야 명세와 코드를 같은 시점끼리 비교한다.
contracts:
  sources:
    - name: contracts-wiki
      repo: 100-hours-a-week/KTB4-13th-wiki
      ref: b772ba5  # main, 2026-09-30
      include: [docs/ai/1-model-api/spec.md, docs/fs/2-api/spec.md]
    - name: ai
      repo: 100-hours-a-week/KTB4-13th-AI
      ref: 421a77c  # main, 2026-10-02
      include: [app/]
      extensions: [.py]
    - name: be
      repo: 100-hours-a-week/KTB4-13th-BE
      ref: 8faa0c1  # main, 2026-10-02
      include: [src/main/java/]
      extensions: [.java]
    - name: fe
      repo: 100-hours-a-week/KTB4-13th-FE
      ref: e27e18c  # main, 2026-10-02
      include: [src/]
      extensions: [.ts, .tsx]
  services:
    - name: AI
      spec: {source: contracts-wiki, path: docs/ai/1-model-api/spec.md}
      server: {source: ai, kind: fastapi}
    - name: BE
      spec: {source: contracts-wiki, path: docs/fs/2-api/spec.md}
      server: {source: be, kind: spring}
  callers:
    - name: BE→AI
      target: AI
      source: be
      kind: restclient
      paths: ["src/main/java/*/infrastructure/client/ai/*"]
    - name: FE→BE
      target: BE
      source: fe
      kind: fetch
      path_prefix: /api/v1
      functions: [fetchWithAuth, fetchPublic]

# 같은 것을 가리키는 말 묶음. 결정 찾기에서 서로 바꿔 찾는다.
# ①~⑧은 AI 엔드포인트 번호다 (docs/ai/1-model-api/spec.md §1).
aliases:
  - ["①", "search", "검색"]
  - ["②", "embeddings", "임베딩"]
  - ["③", "recommendations/chat", "챗봇", "대화 추천"]
  - ["④", "recommendations/feed", "feed", "피드"]
  - ["⑤", "extractions", "취향 추출", "취향 기억"]
  - ["⑥", "preferences/profile", "취향 프로필", "취향 벡터"]
  - ["⑦", "agent/act", "에이전트"]
  - ["CLD", "클라우드", "cloud", "배포"]
