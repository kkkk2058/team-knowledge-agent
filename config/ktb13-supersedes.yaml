# 결정 로그 표에는 "무엇을 뒤집었나" 칸이 없다. 문구("번복")로는 일부만 잡혀서 여기에 적는다.
# wiki 레포가 _preserve-overrides.tsv로 예외를 적는 것과 같은 방식이다.
#
# - 로그 행은 date(MM-DD)와 contains(결정 글에 들어 있는 말)로 찾는다. 딱 한 행이 맞아야 한다.
# - replaces: 이 결정이 뒤집은 이전 결정. 로그에 행이 없는 옛 결정이라 글로 적는다.
# - old_text_at: 옛 서술이 아직 남아 있는 곳(경로:줄). 봇이 이력 한 줄을 붙일지 판단한다 (plan.md D15 ①).
# - superseded_by: 로그 안에서 뒤 행이 이 행을 대체했으면 그 행. 상태가 "대체됨"이 된다.
# - 줄 번호는 config/ktb13.yaml의 기준 커밋 기준이다. 로그가 바뀌면 검사가 알린다.

